# Markdown rules shared by every repository; mirrors the estate policy, each rule on or off for a stated reason.
# MD040, MD034, MD012 and MD010 stay at defaults.
[global]
# MD013: long lines in badge rows and table columns cannot wrap.
# MD036: emphasis-as-heading is a deliberate subtitle.
disable = ["MD013", "MD036"]

[MD033]
allowed-elements = [
  "div",
  "img",
  "a",
  "p",
  "br",
  "h1",
  "h2",
  "sub",
  "nav",
  "ol",
  "li",
  "strong",
  "span",
]

[MD024]
siblings-only = true

[MD029]
style = "ordered"

[per-file-ignores]
# A PR template starts at a second-level heading because the PR title is the first-level one.
".github/pull_request_template.md" = ["MD041"]
# A RIFF chunk identifier is four bytes, so the WAV format chunk is literally
# `fmt ` with a trailing space. The source spells it that way too, matching the
# `b"fmt "` the parser compares against, and MD038 reads the space as stray.
# Correcting it would make the document disagree with the bytes it describes.
"docs/adr/0004-hostile-input-instead-of-a-fuzzer-nobody-can-run.md" = ["MD038"]
