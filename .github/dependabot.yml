# Update root manifests only; nested manifests need a directories list as a project binding.
# Ansible has no Dependabot ecosystem.
# Unused ecosystems are expected: a Dependabot job notice, not a CI failure (verify on first deployment).
# Every ecosystem waits seven days before proposing a newly published version, so a release that is
# compromised and then yanked is unlikely to reach a pull request here. Seven is zizmor's floor for
# the dependabot-cooldown audit; below it the audit reports an insufficient implicit default.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

