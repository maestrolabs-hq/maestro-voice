# Update root manifests only; nested manifests need a directories list as a project binding.
# Ansible has no Dependabot ecosystem.
# Unused ecosystems are expected: a Dependabot job notice, not a CI failure (verify on first deployment).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: cargo
