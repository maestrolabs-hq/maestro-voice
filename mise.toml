# Task runner and uv for the Rust gates; versions are unpinned here, pin with mise use --pin at bootstrap.
# Rust itself comes from rustup reading rust-toolchain.toml, not from mise.
[tools]
just = "latest"
uv = "latest"
# The fast-tier duplication gate. Built from source through mise's cargo
# backend because taiki-e/install-action carries no prebuilt binary for it.
"cargo:similarity-rs" = "latest"
