# Run common repository gates with prek; builtin hooks are prek-only.
default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
default_stages: [pre-commit, pre-merge-commit]
fail_fast: false

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: forbid-new-submodules
      - id: check-vcs-permalinks

  - repo: local
    hooks:
      # Refuse home directories, Windows user roots, and user-profile variables.
      # Deliberately allow /usr, /opt, /etc, /var, /tmp; tests use /somewhere.
      - id: no-machine-paths
        name: no path names a machine
        language: pygrep
        types: [text]
        entry: '(/home/|/Users/|\b[A-Za-z]:[\\/]Users[\\/]|%USERPROFILE%)'
        exclude: '^\.pre-commit-config\.yaml$'

  # English spelling is a separate gate from machine-path detection.
  # Report misspellings; do not rewrite them. The hook's own default args are
  # `[--write-changes, --force-exclude]`, and the write is the dangerous half:
  # a first `git commit` fails having already edited the tree, and a following
  # `git add -A && git commit` then passes with the correction in history,
  # never having shown which word changed. `just fmt` is where a tree is
  # rewritten on purpose. A reported typo is fixed by editing it, or by
  # binding the deliberate spelling in `_typos.toml`.
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.71
    hooks:
      - id: rumdl-check

  # Local links only; remote links belong to the heavy tier.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args: [--offline, --no-progress]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      # Syntax linting only: the hook's default `--default-schema-catalogs`
      # fetches a remote catalog that no longer decodes against the taplo
      # version pinned here, so every run ends in `failed to load schema
      # catalog` before a single file is judged. This is not a network
      # problem; it fails the same way in CI, where there is network.
      #
      # What remains still fails on malformed TOML, which was verified by
      # linting a file with an unterminated array and watching it exit 1.
      # What is lost is catalog-driven schema validation; an inline
      # `#:schema` directive still applies. Restore the flag when the
      # catalog and taplo agree again.
      - id: taplo-lint
        args: []

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent, '2', --simplify]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  # Local staged scan; CI also scans full history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: local
    hooks:
      - id: lang-check
        name: language gates (just lang-check)
        entry: just lang-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
